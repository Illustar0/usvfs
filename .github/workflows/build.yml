name: Build USVFS

on:
  push:
    branches: [master, dev/cmake]
    tags:
      - "*"
  pull_request:
    types: [opened, synchronize, reopened]

env:
  # vcpkg rejects an x-azblob source without a URL, so repositories without the Azure blob
  # fall back to the local binary cache, which the build job keeps in the GitHub cache
  VCPKG_BINARY_SOURCES: ${{ vars.AZ_BLOB_VCPKG_URL && format('clear;x-azblob,{0},{1},readwrite', vars.AZ_BLOB_VCPKG_URL, secrets.AZ_BLOB_SAS) || 'clear;default,readwrite' }}

jobs:
  build:
    name: Build USVFS
    strategy:
      matrix:
        arch: [x86, x64]
        config: [Debug, Release]
    runs-on: windows-2022
    steps:
      # set VCPKG Root
      - name: "Set environmental variables"
        shell: bash
        run: |
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> $GITHUB_ENV
          echo "RUNNER_IMAGE_VERSION=$ImageVersion" >> $GITHUB_ENV

      # checkout USVFS and vcpkg
      - uses: actions/checkout@v4

      # a new runner image can bring a new compiler, which invalidates every cached package
      - name: Cache vcpkg binaries
        if: vars.AZ_BLOB_VCPKG_URL == ''
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ matrix.arch }}-${{ env.RUNNER_IMAGE_VERSION }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-${{ matrix.arch }}-${{ env.RUNNER_IMAGE_VERSION }}-

      # configure
      - run: cmake --preset vs2022-windows-${{ matrix.arch }} -B build_${{ matrix.arch }} "-DCMAKE_INSTALL_PREFIX=install/${{ matrix.config }}"

      # build
      - run: cmake --build build_${{ matrix.arch }} --config ${{ matrix.config }} --target INSTALL

      # package install
      - uses: actions/upload-artifact@master
        with:
          name: usvfs_${{ matrix.config }}_${{ matrix.arch }}
          path: ./install/${{ matrix.config }}

      # package test/dlls/etc. for tests

      - uses: actions/upload-artifact@master
        with:
          name: usvfs-libs_${{ matrix.config }}_${{ matrix.arch }}
          path: ./lib
      - uses: actions/upload-artifact@master
        with:
          name: usvfs-bins_${{ matrix.config }}_${{ matrix.arch }}
          path: ./bin
      - uses: actions/upload-artifact@master
        with:
          name: usvfs-tests_${{ matrix.config }}_${{ matrix.arch }}
          path: ./test/bin

  # merge x86 / x64 artifacts for tests (root bin/lib and test folder)
  merge-artifacts-for-tests:
    runs-on: ubuntu-latest
    name: Merge Test Artifacts
    needs: build
    strategy:
      matrix:
        config: [Debug, Release]
    steps:
      - name: Merge USVFS libs
        uses: actions/upload-artifact/merge@v4
        with:
          name: usvfs-libs_${{ matrix.config }}
          pattern: usvfs-libs_${{ matrix.config }}_*
      - name: Merge USVFS bins
        uses: actions/upload-artifact/merge@v4
        with:
          name: usvfs-bins_${{ matrix.config }}
          pattern: usvfs-bins_${{ matrix.config }}_*
      - name: Merge USVFS tests
        uses: actions/upload-artifact/merge@v4
        with:
          name: usvfs-tests_${{ matrix.config }}
          pattern: usvfs-tests_${{ matrix.config }}_*

  # merge x86 / x64 artifacts (install folder)
  merge-artifacts-for-release:
    runs-on: ubuntu-latest
    name: Merge Install Artifacts
    needs: build
    strategy:
      matrix:
        config: [Debug, Release]
    steps:
      - name: Merge USVFS install
        uses: actions/upload-artifact/merge@v4
        with:
          name: usvfs_${{ matrix.config }}
          pattern: usvfs_${{ matrix.config }}_*

  # flat archives of the x86 and x64 Release binaries, the layout Mod Organizer users unpack
  package:
    name: Package USVFS
    needs: merge-artifacts-for-release
    runs-on: windows-2022
    steps:
      # checkout for the LICENSE
      - uses: actions/checkout@v4

      - name: Download Release Artifact
        uses: actions/download-artifact@v8
        with:
          name: usvfs_Release
          path: ./install

      # 7-Zip stores a path that starts with ./ without its directories
      - name: Create USVFS archives
        shell: bash
        run: |
          dll_files=(
            ./LICENSE
            ./install/bin/usvfs_x64.dll
            ./install/bin/usvfs_x86.dll
            ./install/pdb/usvfs_x64.pdb
            ./install/pdb/usvfs_x86.pdb
          )
          proxy_files=(
            ./install/bin/usvfs_proxy_x64.exe
            ./install/bin/usvfs_proxy_x86.exe
            ./install/pdb/usvfs_proxy_x64.pdb
            ./install/pdb/usvfs_proxy_x86.pdb
          )
          7z a usvfs-dll-only.7z "${dll_files[@]}"
          7z a usvfs.7z "${dll_files[@]}" "${proxy_files[@]}"

      - uses: actions/upload-artifact@v7
        with:
          path: usvfs.7z
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: usvfs-dll-only.7z
          archive: false

  test:
    name: Test USVFS
    needs: merge-artifacts-for-tests
    runs-on: windows-2022
    strategy:
      matrix:
        config: [Debug, Release]
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@master
        with:
          name: usvfs-libs_${{ matrix.config }}
          path: ./lib
      - uses: actions/download-artifact@master
        with:
          name: usvfs-bins_${{ matrix.config }}
          path: ./bin
      - uses: actions/download-artifact@master
        with:
          name: usvfs-tests_${{ matrix.config }}
          path: ./test/bin
      - run: ./test/bin/shared_test_${{ matrix.arch }}.exe
        if: always()
      - run: ./test/bin/testinject_bin_${{ matrix.arch }}.exe
        if: always()
      - run: ./test/bin/thooklib_test_${{ matrix.arch }}.exe
        if: always()
      - run: ./test/bin/tinjectlib_test_${{ matrix.arch }}.exe
        if: always()
      - run: ./test/bin/tvfs_test_${{ matrix.arch }}.exe
        if: always()
      - run: ./test/bin/usvfs_test_runner_${{ matrix.arch }}.exe
        if: always()
      - run: ./test/bin/usvfs_global_test_runner_${{ matrix.arch }}.exe
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-outputs_${{ matrix.config }}_${{ matrix.arch }}
          path: ./test/temp
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  publish:
    if: github.ref_type == 'tag'
    needs: [package, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download USVFS archives
        uses: actions/download-artifact@v8
        with:
          pattern: usvfs*.7z
          path: ./dist
          merge-multiple: true

      # attach the archives to a release made by hand for this tag, or draft one to be
      # given its notes and published by hand
      - name: Upload USVFS archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null; then
            gh release upload "$TAG" ./dist/usvfs.7z ./dist/usvfs-dll-only.7z --clobber
          else
            gh release create "$TAG" --draft --title "$TAG" --notes "" ./dist/usvfs.7z ./dist/usvfs-dll-only.7z
          fi
